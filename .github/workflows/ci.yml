      - name: CRM Completo (banco, RLS e indicadores)
        working-directory: sistemas/01-crm-completo
        run: node scripts/test-db.mjs
      - name: Propostas Comerciais (cálculo, RLS, fluxo, acesso público e indicadores)
        working-directory: sistemas/02-propostas-comerciais
        run: node scripts/test-db.mjs
      - name: Qualificador de Leads (score, formulário, captação pública, RLS, pipeline, indicadores, IA)
        working-directory: sistemas/03-qualificador-leads
        run: node scripts/test-db.mjs
      - name: Qualificador de Leads (mutação das regras críticas)
        working-directory: sistemas/03-qualificador-leads
        run: node scripts/mutation-check.mjs --jobs 2

